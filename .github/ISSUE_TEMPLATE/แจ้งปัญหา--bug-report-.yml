name: แจ้งปัญหา (Bug Report)
description: แจ้งข้อผิดพลาดหรือปัญหาที่พบในปลั๊กอิน
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## ขอบคุณที่ช่วยแจ้งปัญหา ❤️
        กรุณากรอกข้อมูลให้ครบเพื่อให้เราตรวจสอบได้รวดเร็วยิ่งขึ้น
      
  - type: textarea
    id: description
    attributes:
      label: อธิบายปัญหา
      description: อธิบายว่าเกิดอะไรขึ้น
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: วิธีทำให้เกิดปัญหา
      placeholder: |
        1. ทำ...
        2. ใช้คำสั่ง...
        3. เกิดปัญหา...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log / Error
      description: แนบข้อความ Log / Error ทั้งหมด
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: ข้อมูลเพิ่มเติม
      description: เช่น รูปภาพ วิดีโอ หรือไฟล์ config
